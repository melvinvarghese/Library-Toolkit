<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#1a3fd0">
  <meta name="description" content="Free browser-based tools for librarians. Create barcodes, prepare labels and organize library records without installing anything.">
  <meta property="og:title" content="Library Toolkit | Free tools for librarians">
  <meta property="og:description" content="Barcodes, labels and records for your library. Free, in your browser, nothing uploaded.">
  <meta property="og:type" content="website">
  <meta property="og:image" content="https://melvinvarghese.github.io/Library-Toolkit/assets/og-image.webp">
  <meta property="og:image:alt" content="Library Toolkit — free tools for librarians">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://melvinvarghese.github.io/Library-Toolkit/assets/og-image.webp">
  <meta name="twitter:image:alt" content="Library Toolkit — free tools for librarians">
  <title>Library Toolkit | Free tools for librarians</title>
  <link rel="icon" type="image/svg+xml" href="./favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,100..900&display=swap" rel="stylesheet">
</head>
<body>
  <div id="app"></div>
  <script>
    (() => {
      let reported = false;
      const report = (message) => {
        if (reported) return;
        reported = true;
        const panel = document.createElement("section");
        panel.setAttribute("role", "alert");
        panel.style.cssText = "box-sizing:border-box;max-width:680px;margin:48px auto;padding:28px;border:1px solid #c96b54;background:#fffdf8;color:#202722;font:16px/1.6 system-ui,sans-serif";
        const heading = document.createElement("h1");
        heading.textContent = "Library Toolkit couldn't start";
        heading.style.cssText = "margin:0 0 12px;font-size:24px";
        const detail = document.createElement("p");
        detail.textContent = message || "The page scripts did not finish loading.";
        detail.style.cssText = "overflow-wrap:anywhere;margin:0 0 12px";
        const help = document.createElement("p");
        help.textContent = "Please send a screenshot of this message to the site maintainer. You can also try refreshing the page.";
        help.style.margin = "0";
        panel.append(heading, detail, help);
        const app = document.getElementById("app");
        if (app) {
          app.replaceChildren(panel);
        } else {
          document.body.replaceChildren(panel);
        }
      };
      window.addEventListener("error", (event) => {
        const detail = event.message || (event.target && event.target.src ? "Could not load script: " + event.target.src : "A browser script error occurred.");
        report(detail);
      }, true);
      window.addEventListener("unhandledrejection", (event) => {
        const reason = event.reason;
        report(reason && reason.message ? reason.message : String(reason || "An unexpected startup error occurred."));
      });
      window.setTimeout(() => {
        const app = document.getElementById("app");
        if (app && app.childElementCount === 0) {
          report("The application did not render within 5 seconds. This may mean its JavaScript file failed to load or stopped during startup.");
        }
      }, 5000);
    })();
  </script>
  <script type="module" src="/src/main.ts"></script>
  <script data-goatcounter="https://librarytools.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>
